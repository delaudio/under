name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install Neovim
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install neovim
          else
            curl -fsSL https://github.com/neovim/neovim/releases/download/v0.11.5/nvim-linux-x86_64.tar.gz | tar -xz
            echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          fi
      - run: bun install --frozen-lockfile
      - name: Install tool integration fixtures
        run: |
          bun install --global hunkdiff@0.23.0 @openai/codex@0.162.1 @anthropic-ai/claude-code@2.1.296 opencode-ai@1.19.0
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install yazi
          else
            curl -fsSL https://github.com/sxyazi/yazi/releases/download/v25.5.31/yazi-x86_64-unknown-linux-musl.zip -o yazi.zip
            unzip -q yazi.zip
            echo "$PWD/yazi-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          fi
      - run: nvim --version
      - run: yazi --version && hunk --version && codex --version && claude --version && opencode --version
      - run: bun run check
      - run: ./under --help && ./under --version
  visual:
    # PNG baselines are Chromium/macOS. Native PTY checks also run on Linux above.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - run: bun run typecheck:storybook
      - run: bun run test:storybook:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tui-visual-results
          path: |
            playwright-report/
            test-results/
            storybook-static/
